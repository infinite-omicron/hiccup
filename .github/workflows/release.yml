name: Release

# release-please reads the Conventional Commits on main and keeps a release PR
# open with the next SemVer version and changelog. Merging that PR tags vX.Y.Z
# and publishes a GitHub Release. The assets job then attaches the jar and the
# macOS, Linux and Windows binaries, attests their build provenance, and lists
# them on https://github.com/orgs/infinite-omicron/artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build assets for, e.g. v0.1.0
        required: true

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please labels its PRs
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  assets:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # signs the provenance attestations
      attestations: write
      artifact-metadata: write # storage records for the linked artifacts page
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
          fetch-depth: 0
      - name: Check the tag is SemVer
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a SemVer tag (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: make release VERSION="$TAG"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release/checksums.txt
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/release/* --clobber
      - name: List the assets on the organization's linked artifacts page
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/storage-records.sh "$TAG" dist/release/checksums.txt

  homebrew:
    needs: [release-please, assets]
    if: always() && needs.assets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
      # Either a deploy key with write access on infinite-omicron/homebrew-tap
      # (preferred: scoped to that repo, no expiry), or a fine-grained token with
      # Contents: read and write on it.
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Decide whether to update the cask
        id: gate
        run: |
          if [ -z "$TAP_KEY" ] && [ -z "$TAP_TOKEN" ]; then
            echo "::warning::Neither HOMEBREW_TAP_DEPLOY_KEY nor HOMEBREW_TAP_TOKEN is set; skipping the Homebrew cask update"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-* ]]; then
            echo "Pre-release $TAG: the cask only tracks stable releases"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: infinite-omicron/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          path: tap
      - name: Update Casks/hiccup.rb
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern checksums.txt --dir "$RUNNER_TEMP"
          .github/scripts/cask.sh "${TAG#v}" "$RUNNER_TEMP/checksums.txt" > tap/Casks/hiccup.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/hiccup.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
            exit 0
          fi
          git commit -m "feat(hiccup): update to ${TAG#v}"
          git push
